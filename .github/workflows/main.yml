name: M-R Otonom Pipeline

on:
  schedule:
    # 4 Tem: Emre → 4 video/gün (SEDA kapalı; hepsi bu ana pipeline'da).
    # 1 ÖĞLEN + 3 AKŞAM: TR 13/19/21/23 = 10/16/18/20 UTC.
    # Kota: frugal AÇIK + denetim ayrık → video başı ~5 çağrı, 4 video ~20 (40 kotanın yarısı).
    # 7 Ağu: hedef 4 video ama 7 cron saati — GitHub schedule gecikmeleri ve
    # kesintilerde kaçan slot sonraki saatte telafi edilir. Hedef dolunca
    # yukleyici._gunluk_tavan_kontrolu zarifçe durdurur (fazla basım YOK).
    # 23 Ağu ÖLÇÜM (150 video, 3-12 günlük ve tüm-zaman iki kesitte aynı yön):
    #   yayın saati(UTC) → medyan izlenme: 10→25 · 13→22 · 16→22 · 17→70 · 18→63
    #   19→94 · 20→114 · 21→98. Yani 7 slotun ÜÇÜ (10/13/16) en kötü bantta,
    #   günün ilk 3 videosu oraya düşüyordu. TR izleyicisi akşam: 17-21 UTC = 20-24 TR.
    #   Yeni küme tamamen o bantta; 22 UTC telafi slotu. 00 UTC BİLEREK yok —
    #   günlük sayaç UTC tarihine bakıyor, gece yarısını geçen slot sayacı sıfırlar.
    - cron: "0 17,18,19,20,21,22 * * *"
  workflow_dispatch:
    inputs:
      gizlilik:
        description: "Yayın gizliliği (private | unlisted | public)"
        required: false
        default: "public"
        type: choice
        options:
          - public
          - unlisted
          - private

# 🔒 31 Ağu — MÜKERRER YAYIN KİLİDİ.
# Üç tetik yolu var (GitHub cron + Mac launchd :10 + Hetzner :12). Üçü de "bugün kaç
# video çıktı" diye bakıp eksikse tetikliyor — ama BİRBİRLERİNİ GÖRMÜYORLAR: iki tetik
# 2 dk arayla ateşlendiğinde ikisi de aynı eksik sayısını okuyup ikisi de yayın yapıyordu.
# Kanıt: 30 Ağu Cosmos 19:14 + 19:15 (iki ayrı video), 23:12+23:13+23:17 → günde 4 yerine 6.
# Slot kapısı bunu YAKALAYAMAZ: iki koşu da kapıyı, ilki henüz yayınlamadan geçiyor (yarış).
# Çözüm sunucu tarafında: aynı anda tek koşu. İkinci koşu sıraya girer, birincisi bitip
# yuklemeler.json'ı güncelledikten sonra başlar ve slot kapısında zarifçe durur.
concurrency:
  group: yayin-hatti
  cancel-in-progress: false

permissions:
  contents: write   # yuklemeler.json + haberler.json commit
  issues: write     # fail durumunda otomatik issue (mail bildirimi tetikler)

jobs:
  # 24 Ağu: SLOT KAPISI EN BAŞA ALINDI. Eskiden kapı yukleyici'nin içindeydi;
  # pipeline önce senaryo+TTS+montaj yapıp EN SONDA "hedef dolu" deyip çıkıyordu.
  # Ölçülen israf: atlanan koşu başına 4,5-6 dk + boşa Gemini/TTS kotası; 23 Ağu'da
  # bir koşu 4K klip yüzünden 35 dk timeout'a çarpıp iptal oldu. Artık slot kapalıysa
  # ağır job HİÇ BAŞLAMAZ (~15 sn, bağımlılık/secret bile kurulmaz).
  slot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      acik: ${{ steps.kapi.outputs.acik }}
    steps:
      - uses: actions/checkout@v4
      - id: kapi
        run: |
          if python3 slot_kapisi.py; then
            echo "acik=1" >> $GITHUB_OUTPUT
          else
            echo "acik=0" >> $GITHUB_OUTPUT
          fi

  shorts-pipeline:
    needs: slot
    # Elle tetikte (workflow_dispatch) kapı yine de yukleyici içinde çalışır;
    # burada sadece zamanlanmış koşular için erken çıkış yapılıyor.
    if: needs.slot.outputs.acik == '1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # 4 Tem: frugal AÇIK ama fabrikasyon denetimi bridge'de TASARRUF'tan ayrıldı →
      # denetim yine çalışır; sadece opsiyonel süsleme (hook/metin_onay) atlanır.
      # İzleyicinin gördüğü video AYNI. 4 video ~20 çağrı = 40 kotanın yarısı (bol marj).
      GEMINI_TASARRUF: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write secrets to runtime files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          AMAZON_ASSOCIATES_TAG: ${{ secrets.AMAZON_ASSOCIATES_TAG }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          {
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
            echo "GEMINI_API_KEY_2=${GEMINI_API_KEY_2}"
            echo "PEXELS_API_KEY=${PEXELS_API_KEY}"
            echo "PIXABAY_API_KEY=${PIXABAY_API_KEY}"
            echo "JAMENDO_CLIENT_ID=${JAMENDO_CLIENT_ID}"
            echo "REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID}"
            echo "REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET}"
            echo "PINTEREST_TOKEN=${PINTEREST_TOKEN}"
            echo "PINTEREST_BOARD_ID=${PINTEREST_BOARD_ID}"
            echo "AMAZON_ASSOCIATES_TAG=${AMAZON_ASSOCIATES_TAG}"
          } > .env
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_JSON"         > token.json
          # Sağlamlık doğrulaması (içerik yok ya da bozuksa burada erken patlasın)
          python -c "import json; json.load(open('client_secret.json')); json.load(open('token.json')); print('secrets OK')"

      # 11 Tem KALDIRILDI: viral_radar/competitor_scan/trend_signal_mixer
      # TC şablonundan kalma HAYVAN/PSİKOLOJİ seed'leriyle çalışıyordu (yanlış niş)
      # ve viral_radar YouTube search.list (100 birim/çağrı) ile PAYLAŞILAN YouTube
      # kotasını yakıp 429 → upload'ları vuruyordu. Akasha konuları zaten manuel
      # spiritüel kuyruk + Gemini'den geliyor; bu adımlar gereksiz + zararlıydı.

      - name: 1) Haberci — manuel spiritüel kuyruk + Gemini (TR spiritüel/Jung niche)
        run: python haberci.py

      - name: 2) Seslendirici — Gemini senaryo + edge-tts MP3 (hook+CTA güçlendirilmiş)
        run: python seslendirici.py

      - name: 3) Montajcı — Pexels + Wikimedia + Suno fallback → 1080×1920 MP4
        run: python montajci.py

      - name: 4) Yükleyici — YouTube Shorts upload + affiliate açıklama
        env:
          GIZLILIK: ${{ github.event.inputs.gizlilik || 'public' }}
        run: python yukleyici.py --gizlilik "$GIZLILIK" --kategori people

      - name: 4b) Post-Upload — Thumbnail set + Pinterest pin + Instagram story
        if: success()
        continue-on-error: true
        env:
          IG_AKASHA_TOKEN: ${{ secrets.IG_AKASHA_TOKEN }}
          IG_AKASHA_USER_ID: ${{ secrets.IG_AKASHA_USER_ID }}
        run: python post_upload.py

      - name: 5) Pattern Detector — viral öğrenme loop
        if: success()
        continue-on-error: true
        run: python pattern_detector.py --esik 500

      - name: 5b) Retention Learner — drop-off feedback → seslendirici
        if: success()
        continue-on-error: true
        run: python retention_learner.py

      - name: 6) Analytics çek — retention + CTR + traffic source
        if: success()
        continue-on-error: true
        run: python analytics.py --gun 14

      - name: 7) Dashboard üret — lokal HTML KPI panel
        if: success()
        continue-on-error: true
        run: python dashboard.py

      - name: 8) A/B title karşılaştır (24h+ önceki testler)
        if: success()
        continue-on-error: true
        run: python ab_title_test.py --karsilastir

      - name: 8b) Thumbnail A/B karşılaştır + auto-swap (24h+)
        if: success()
        continue-on-error: true
        run: python thumbnail_ab.py --karsilastir

      - name: 9) YPP Eligibility Tracker — para yolu durumu
        if: success()
        continue-on-error: true
        run: python ypp_tracker.py

      - name: 10) Sponsor Media Kit — outreach raporu
        if: success()
        continue-on-error: true
        run: python sponsor_kit.py

      - name: 11) Yorum Yanıt Bot — kanaldaki yeni yorumlara cevap (cron yedek)
        if: success()
        continue-on-error: true
        run: python yorum_yanit_bot.py --max-cevap 3 --min-yas 5

      - name: 12) Schedule Optimizer — optimum yayın saatleri (rapor)
        if: success()
        continue-on-error: true
        run: python schedule_optimizer.py

      - name: 13) Community Post — viral video'lar için poll kuyruğu
        if: success()
        continue-on-error: true
        run: python community_post.py

      - name: 14) QC kontrol — son yayınlanan video düzgün mü
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # OCR (altyazı taşma kontrolü için)
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng >/dev/null 2>&1 || true
          echo "⏳ 60sn bekle (YouTube indeksleme için)..."
          sleep 60
          python qc_video.py --son 1 --issue || echo "QC sorunu var, issue açıldı"

      - name: State commit (JSON-aware merge + push retry)
        if: always()
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: bash state_push.sh

      - name: Upload artifacts (debug için)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_number }}
          path: |
            ses_ciktilari/
            shorts_ciktilari/
            yuklemeler.json
            haberler.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Başarılı yayın bildirimi (issue + mail)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .basarili_yayin ]; then
            VID=$(python3 -c "import json; print(json.load(open('.basarili_yayin'))['video_id'])")
            TITLE=$(python3 -c "import json; print(json.load(open('.basarili_yayin'))['title'])")
            WATCH=$(python3 -c "import json; print(json.load(open('.basarili_yayin'))['watch_url'])")
            STUDIO=$(python3 -c "import json; print(json.load(open('.basarili_yayin'))['studio_url'])")
            GIZ=$(python3 -c "import json; print(json.load(open('.basarili_yayin'))['gizlilik'])")
            TAG=$(python3 -c "import json; print(json.load(open('.basarili_yayin'))['tag_sayisi'])")
            ACK=$(python3 -c "import json; print(json.load(open('.basarili_yayin'))['aciklama_uzunluk'])")
            gh issue create \
              --title "✅ Yeni video yayında — $TITLE" \
              --body "**Run #${{ github.run_number }}** otomatik yayın tamamlandı.

          - **Başlık:** $TITLE
          - **Video ID:** \`$VID\`
          - **Watch:** $WATCH
          - **Studio:** $STUDIO
          - **Gizlilik:** $GIZ
          - **SEO:** $TAG tag, açıklama $ACK karakter
          - **Denetim:** UYGUN ✓ (telif/clickbait/olgusal/politika/marka)

          İzlemek istemiyorsan bu issue'yu kapat. Sorun varsa Studio'dan müdahale et."
            rm -f .basarili_yayin
          fi

      # 30 Ağu: Leda 503 alınca video SESSİZCE Emel sesiyle çıkıyordu (son 8 koşunun
      # 3'ünde oldu, kimse fark etmedi). Artık yedek sese düşüldüyse issue açılır.
      - name: Ses yedeğe düştüyse uyar (Leda → Emel)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .ses_yedege_dustu ]; then
            gh issue create \
              --title "🔊 Akasha YEDEK SESLE yayınlandı — run #${{ github.run_number }}" \
              --body-file .ses_yedege_dustu
            rm -f .ses_yedege_dustu
          fi

      - name: Denetim uyarısı (şüpheli/redded içerik → issue + mail)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .denetim_uyari ]; then
            NOT=$(cat .denetim_uyari)
            gh issue create \
              --title "⚠️ Denetim uyarısı — run #${{ github.run_number }}" \
              --body "Yayın uygunluk denetimi içeriği şüpheli buldu, video PRIVATE olarak yüklendi.

          **Karar/Sebep:** $NOT

          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          İncele: https://studio.youtube.com/ → Akasha → Content → en yeni video.
          Uygunsa Public yap, değilse Tamamen sil. Sorunu çözünce bu issue'yu kapat."
            rm -f .denetim_uyari
          fi

      - name: Hata bildirimi (fail durumunda issue aç → mail tetiklenir)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 Pipeline FAIL — run #${{ github.run_number }} ($(date -u +'%Y-%m-%d %H:%MZ'))" \
            --body "Workflow başarısız oldu. Detaylar için run sayfasını aç:

          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          - Run number: ${{ github.run_number }}
          - Tetikleyici: ${{ github.event_name }}
          - Bittiği zaman: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          Bu issue otomatik açıldı. Sorunu çözünce close et."
