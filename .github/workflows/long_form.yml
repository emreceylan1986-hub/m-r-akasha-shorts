name: Akasha Long-Form Haftalık (Pazar 07:00 UTC = 10:00 TR)

on:
  schedule:
    - cron: "0 7 * * 0"  # Pazar 07:00 UTC — Shorts cron'larından (10,16,18,20) önce
  workflow_dispatch:
    inputs:
      konu:
        description: "Konu zorla (boş = rotasyondan)"
        required: false
        default: ""
      kuru:
        description: "Kuru mod (upload yok)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Write secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" > .env
          printf '%s' "$TOKEN_JSON" > token.json

      - name: Long-form üret + yayınla
        run: |
          EK=""
          if [ -n "${{ github.event.inputs.konu }}" ]; then EK="--konu \"${{ github.event.inputs.konu }}\""; fi
          if [ "${{ github.event.inputs.kuru }}" = "true" ]; then EK="$EK --kuru"; fi
          eval python long_form_uretici.py $EK

      # 23 Eyl: Emel'e düşüş sessizdi — artık issue açılıyor (Shorts'taki gibi).
      - name: Ses yedeğe düştüyse uyar (Leda → Emel)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .ses_yedege_dustu ]; then
            gh issue create \
              --title "🔊 Akasha UZUN VİDEO yedek sesle çıktı — run #${{ github.run_number }}" \
              --body-file .ses_yedege_dustu
            rm -f .ses_yedege_dustu
          fi

      - name: State commit (long_form_gecmis.json)
        if: always()
        run: |
          git config user.name "akasha-bot"
          git config user.email "bot@akasha"
          git add long_form_gecmis.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "🤖 long-form geçmişi"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
